services:
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_USER}
      POSTGRES_DB: chat_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    ports:
      - '3000:3000'
    environment:
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      - db

volumes:
  postgres_data:

server:
    build: .
    ports:
      - '3000:3000'
    env_file:
      - .env.prod # This file should contain your PUSHER_ keys for the container
    environment:
      - DATABASE_URL=postgresql://postgres:prisma@postgres_db:5432/postgres?schema=public
    depends_on:
      postgres_db:
        condition: service_healthy
