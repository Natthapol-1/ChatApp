
services:
  db: # This is your database service
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: chat_db
    ports:
      - '5432:5432'
    healthcheck: # Added this so the app knows when the DB is ready
      test: ["CMD-SHELL", "pg_isready -U postgres -d chat_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app: # Use this name for your Next.js container
    build: .
    ports:
      - '3000:3000'
    env_file:
      - .env.prod
    environment:
      # This points to the service name 'db' inside the Docker network
      - DATABASE_URL=postgresql://postgres:password@db:5432/chat_db?schema=public
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: